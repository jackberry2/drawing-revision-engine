[project]
name = "dre"
version = "0.1.0"
description = "Detection engine for electrical drawing revision analysis"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dre = "dre.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
