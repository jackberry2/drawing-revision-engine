[project]
name = "dre"
version = "0.1.0"
description = "Detection engine for electrical drawing revision analysis"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "supabase>=2.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "click>=8.1",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dre = "dre.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dre.llm.prompts" = ["*.md"]
